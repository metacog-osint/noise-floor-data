name: ism-hourly
on:
  schedule:
    - cron: "11,41 * * * *"   # twice an hour: GitHub drops some scheduled runs; the script skips hours already captured. ~1,440 min/month (free tier 2,000)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ism-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Capture ISM nowcast (S4, sigma-phi, TEC)
        run: python capture/ism_capture.py .
      - name: Commit new snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ism
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "ism: $(tail -1 ism/summary.csv | cut -d, -f1)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
